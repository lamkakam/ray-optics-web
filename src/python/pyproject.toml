[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rayoptics-web-utils"
version = "0.40.2"
requires-python = ">=3.12"
dependencies = [
    "anytree==2.13.0",
    "transforms3d==0.4.2",
    "json-tricks==3.17.3",
    "openpyxl==3.1.5",
    "parsimonious==0.11.0",
    "matplotlib==3.10.8",
    "numpy==2.4.3",
    "pandas==3.0.2",
    "xlrd==2.0.2",
    "requests==2.33.1",
    "packaging==26.1",
    "deprecation==2.1.0",
    "traitlets==5.14.3",
    "pyyaml",
    "scipy==1.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rayoptics_web_utils = ["data/*.yml"]

[tool.mutmut]
source_paths = ["src/rayoptics_web_utils"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportMissingParameterType = "error"
