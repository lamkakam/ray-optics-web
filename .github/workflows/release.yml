name: Release and prepare Cloudflare Pages

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  deployments: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCHIVE_NAME: ray-optics-web-${{ github.ref_name }}-dist.zip
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: bash scripts/init-python-venv.sh
      - run: bash scripts/build-python-wheel.sh
      - run: npm ci
      - name: Fetch lens data fixtures
        run: bash scripts/fetch-lens-data.sh
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - run: npm run prepare:release
      - run: npm run prepare:cloudflare
      - name: Package static export
        working-directory: release-dist
        run: zip -r "$GITHUB_WORKSPACE/$ARCHIVE_NAME" .
      - uses: actions/upload-artifact@v6
        with:
          name: release-distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: cloudflare-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloudflare-pages
          retention-days: 1

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    env:
      ARCHIVE_NAME: ray-optics-web-${{ github.ref_name }}-dist.zip
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-distribution-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Create or update GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE_NAME" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ARCHIVE_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://ray-optics-web.vestibulum.xyz/
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: cloudflare-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloudflare-pages
      - name: Initialize Cloudflare Pages project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          project_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/ray-optics-web"
          status=$(curl --silent --show-error --output project.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$project_url")
          if [ "$status" = 404 ]; then
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data '{"name":"ray-optics-web","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          elif [ "$status" != 200 ]; then
            cat project.json
            exit 1
          fi
      - uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy cloudflare-pages --project-name=ray-optics-web --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach Cloudflare Pages custom domain
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          domain_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/ray-optics-web/domains/ray-optics-web.vestibulum.xyz"
          status=$(curl --silent --show-error --output domain.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$domain_url")
          if [ "$status" = 404 ]; then
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data '{"name":"ray-optics-web.vestibulum.xyz"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/ray-optics-web/domains"
          elif [ "$status" != 200 ]; then
            cat domain.json
            exit 1
          fi
