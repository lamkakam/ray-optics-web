name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      non_markdown: ${{ steps.changed-files.outputs.non_markdown }}
      python: ${{ steps.changed-files.outputs.python }}
    steps:
      - id: changed-files
        uses: dorny/paths-filter@v4
        with:
          filters: |
            non_markdown:
              - '!**/*.md'
            python:
              - '**/*.py'
  validate:
    needs: changes
    if: needs.changes.outputs.non_markdown == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: bash scripts/init-python-venv.sh
      - if: needs.changes.outputs.python == 'true'
        run: bash scripts/run-python-tests.sh
      - run: bash scripts/build-python-wheel.sh
      - run: npm ci
      - name: Fetch lens data fixtures
        run: bash scripts/fetch-lens-data.sh
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /ray-optics-web
  ci:
    needs: [changes, validate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful validation or an intentional Markdown-only skip
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NON_MARKDOWN: ${{ needs.changes.outputs.non_markdown }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::Change detection did not succeed ($CHANGES_RESULT)."
            exit 1
          fi
          case "$NON_MARKDOWN:$VALIDATE_RESULT" in
            true:success)
              echo "Validation passed."
              ;;
            false:skipped)
              echo "Markdown-only change; validation intentionally skipped."
              ;;
            *)
              echo "::error::Unexpected validation result ($VALIDATE_RESULT) for non_markdown=$NON_MARKDOWN."
              exit 1
              ;;
          esac
